# Downloads OpenStreetMap data for the map importer (tools/osm). Runs when
# a query file changes on an osm-data* branch, or by hand. The raw Overpass
# JSON is gzipped into data/osm/<name>/ and committed back to the branch.
# Map data (c) OpenStreetMap contributors, ODbL 1.0.
name: Fetch OSM data
on:
  push:
    branches: ['osm-data*']
    paths: ['tools/osm/*.overpassql', 'tools/osm/extract.py', '.github/workflows/osm-fetch.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run each query against Overpass
        run: |
          # An area already fetched is left alone (delete its raw.json.gz to
          # fetch it again), so data the map checks were run on never shifts
          # by accident. Each area tries every Overpass server once; one that
          # they all refuse is answered from a downloaded extract instead
          # (next step).
          failed=""
          for q in tools/osm/*.overpassql; do
            name=$(basename "$q" .overpassql)
            if [ -s "data/osm/$name/raw.json.gz" ]; then echo "$name: already fetched"; continue; fi
            ok=""
            # (Once every server has refused one area, the rest are not asked.)
            for url in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://overpass.private.coffee/api/interpreter; do
              [ -n "$failed" ] && break
              echo "$name: $url"
              if curl -sS --fail -m 120 -H "User-Agent: pocket-overland-osm-import/1.0 (+https://github.com/hohungyiai/pocket-overland-claude)" --data-urlencode "data@$q" "$url" -o "/tmp/$name.json" \
                && python3 -c "import json; d=json.load(open('/tmp/$name.json')); n=len(d['elements']); print(n, 'elements'); assert n > 0 and not d.get('remark')"; then ok=1; break; fi
              sleep 5
            done
            if [ -z "$ok" ]; then failed="$failed $name"; continue; fi
            mkdir -p "data/osm/$name"
            gzip -9 -c "/tmp/$name.json" > "data/osm/$name/raw.json.gz"
            { echo "# $name (OpenStreetMap extract)"; echo; echo "Fetched $(date -u +%Y-%m-%dT%H:%MZ) from Overpass with tools/osm/$name.overpassql."; echo; echo "Map data (c) OpenStreetMap contributors, ODbL 1.0. https://www.openstreetmap.org/copyright"; } > "data/osm/$name/README.md"
          done
          echo "FAILED=$failed" >> "$GITHUB_ENV"
      - name: Answer the refused areas from the Geofabrik extract
        if: env.FAILED != ''
        run: |
          set -e
          sudo apt-get install -y -q osmium-tool
          pip install -q osmium
          curl -sS --fail -L -m 1500 -o /tmp/region.osm.pbf https://download.geofabrik.de/asia/malaysia-singapore-brunei-latest.osm.pbf
          # (Singapore and a margin; whole ways and multipolygons are kept.)
          osmium extract -b 103.55,1.10,104.20,1.55 -s smart /tmp/region.osm.pbf -o /tmp/sg.osm.pbf
          for name in $FAILED; do
            python3 tools/osm/extract.py /tmp/sg.osm.pbf "tools/osm/$name.overpassql" "/tmp/$name.json"
            mkdir -p "data/osm/$name"
            gzip -9 -c "/tmp/$name.json" > "data/osm/$name/raw.json.gz"
            { echo "# $name (OpenStreetMap extract)"; echo; echo "Taken $(date -u +%Y-%m-%dT%H:%MZ) from the Geofabrik extract of Malaysia, Singapore and Brunei with tools/osm/extract.py and tools/osm/$name.overpassql."; echo; echo "Map data (c) OpenStreetMap contributors, ODbL 1.0. https://www.openstreetmap.org/copyright"; } > "data/osm/$name/README.md"
          done
      - name: Commit the data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/osm
          git diff --cached --quiet || git commit -m "Fetch OSM data"
          git push
