<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#b9d3df" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>Pocket Overland</title>
  </head>
  <body>
    <div id="app">
      <div id="touch"></div>
      <div id="steer-base" class="stick"><div id="steer-knob" class="knob"></div></div>
      <div id="pedal-base" class="stick vertical"><div id="pedal-knob" class="knob"></div></div>

      <div id="hud">
        <div class="speed"><span id="hud-speed">0</span><small>km/h</small></div>
        <div id="hud-fuel" class="fuel" hidden><i><b></b></i><span></span></div>
        <div id="hud-surface" class="surface">Gravel</div>
        <div id="hud-zone" class="zone"></div>
      </div>
      <div id="hud-fps" class="fps"></div>

      <button id="btn-cam" class="btn cam">Chase</button>
      <button id="btn-style" class="btn style" hidden>Detailed</button>
      <div class="right-buttons">
        <button id="btn-low" class="btn">LOW</button>
        <button id="btn-diff" class="btn">DIFF</button>
        <button id="btn-reset" class="btn" aria-label="Recover">&#8634;</button>
      </div>

      <div id="hint">
        <p><b>Left thumb</b>: drag sideways to steer</p>
        <p><b>Right thumb</b>: drag up to go, down to brake or reverse</p>
        <p class="small">LOW = low range for climbs and rocks · DIFF = locks the differential · Keyboard: WASD, L, K, R, C</p>
      </div>
      <button id="btn-camp" class="btn camp" hidden>Make camp</button>
      <button id="btn-backup" class="btn camp" hidden>Back up your journey</button>
      <button id="btn-fuel" class="btn camp fill" hidden>Fill up</button>
      <button id="btn-garage" class="btn camp" hidden>Enter garage</button>
      <button id="btn-retry" class="btn camp" hidden>Try again</button>
      <div id="notice" class="notice" hidden></div>
      <div id="fade"></div>
      <div id="rotate">Turn your phone sideways to drive</div>
      <button id="btn-menu" class="btn menu" aria-label="Menu">&#9776;</button>
      <div id="loading">Building the world…</div>
      <div id="menu">
        <h1>Pocket Overland</h1>
        <div id="menu-warning" class="menu-note" hidden></div>
        <p>Choose a drive</p>
        <div class="choices">
          <button data-course="whole"><b>Pasir Ris &amp; Tampines</b><span>Singapore · real streets, parks and blocks · map data © OpenStreetMap contributors</span></button>
          <button data-course="eastcoast"><b>East Coast &amp; Changi</b><span>Singapore · East Coast Park, Changi Coast Road, Changi Beach</span></button>
          <button data-course="ubintrail"><b>Pulau Ubin: Ketam Trail</b><span>Easy trail · jetty to Endut Senin camp round Ketam Quarry · map data © OpenStreetMap contributors</span></button>
          <button data-course="ubinpuaka"><b>Pulau Ubin: Puaka Hill</b><span>Medium trail · roots and rock, a loose descent and the ledges to the top of Puaka Hill · map data © OpenStreetMap contributors</span></button>
          <button data-course="ubinchekjawa"><b>Pulau Ubin: Chek Jawa</b><span>Super hard trail · ford, tidal sand, an off-camber shore and mangrove mud, no signs · map data © OpenStreetMap contributors</span></button>
          <button data-course="ubin"><b>Ubin test track</b><span>Gravel loop · climb, rocks, water, sand</span></button>
        </div>
        <div id="menu-tools" class="menu-tools"></div>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
